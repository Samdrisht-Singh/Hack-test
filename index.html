<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert // सुरक्षा अलर्ट</title>
    
    <!-- 1. GOATCOUNTER TRACKING SCRIPT -->
    <script data-goatcounter="https://YOUR_GOATCOUNTER_ACCOUNT_HERE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        /* Hacker Bait Overlay */
        #bait-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            text-align: center;
        }
        .glitch {
            color: #0f0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
            margin-bottom: 10px;
        }
        .glitch-hindi {
            color: #0f0;
            font-size: 20px;
            animation: pulse 1.5s infinite;
        }
        /* Main Warning Content */
        #warning-screen {
            display: none;
            max-width: 500px;
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-top: 5px solid #ff003c;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
            text-align: center;
        }
        .icon {
            margin-bottom: 20px;
        }
        .icon svg {
            width: 70px;
            height: 70px;
            fill: #ff003c;
            filter: drop-shadow(0 0 10px rgba(255, 0, 60, 0.5));
        }
        h1 {
            color: #ff003c;
            font-size: 28px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .message-box {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ff003c;
        }
        .text-english {
            font-size: 18px;
            color: #fff;
            line-height: 1.5;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .text-hindi {
            font-size: 19px;
            color: #f1c40f; 
            line-height: 1.5;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .flash {
            animation: flashRed 0.4s ease-out;
        }
        @keyframes flashRed {
            0% { box-shadow: inset 0 0 100px rgba(255, 0, 60, 0.9); }
            100% { box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- Audio Element (Siren) -->
    <audio id="sirenSound" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" preload="auto"></audio>

    <!-- Bait Screen (Requires user tap to play sound) -->
    <div id="bait-screen" onclick="triggerTrap()">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="#0f0" style="margin-bottom: 20px;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <div class="glitch">Tap to Open</div>
        <div class="glitch-hindi">खोलने के लिए टच करें</div>
    </div>

    <!-- Warning Screen -->
    <div id="warning-screen">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C7.58 2 4 5.58 4 10v4l-2 2v2h20v-2l-2-2v-4c0-4.42-3.58-8-8-8zm-2 10H8v-2h2v2zm6 0h-2v-2h2v2zm-2.5 4H10v-1h3.5v1z"/>
            </svg>
        </div>
        
        <h1>🚨 WAIT! / रुकिए!</h1>
        
        <div class="message-box">
            <p class="text-english">
                This was a security test. Never scan unknown QR codes. Hackers can empty your bank account and steal your data.
            </p>
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <p class="text-hindi">
                यह एक साइबर सुरक्षा टेस्ट था। किसी अनजान QR कोड को स्कैन न करें। हैकर्स आपका बैंक खाता खाली कर सकते हैं।
            </p>
        </div>

        <div class="review-section" style="margin-top: 25px; border-top: 1px dashed #333; padding-top: 20px;">
            <h3 style="color: #0f0; margin-bottom: 15px; font-size: 16px; text-transform: uppercase;">Leave a Review</h3>
            
            <!-- 2. FORMSPREE ENDPOINT URL -->
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT_ID_HERE" method="POST" style="display: flex; flex-direction: column; gap: 10px;">
                
                <select name="Tricked" style="padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #0f0; border-radius: 4px; font-family: monospace;">
                    <option value="">Did the bait trick you?</option>
                    <option value="Yes">Yes, I scanned it blindly.</option>
                    <option value="No">No, I suspected it was a test.</option>
                </select>
                <textarea name="Feedback" rows="3" placeholder="What did you learn?" required style="padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #0f0; border-radius: 4px; resize: none; font-family: monospace;"></textarea>
                <button type="submit" style="padding: 12px; background: #ff003c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-family: monospace;">Submit Log</button>
            </form>
        </div>
    </div>

    <script>
        function triggerTrap() {
            const sound = document.getElementById('sirenSound');
            sound.volume = 0.5;
            sound.play();

            document.getElementById('bait-screen').style.display = 'none';
            const warningScreen = document.getElementById('warning-screen');
            warningScreen.style.display = 'block';
            
            document.body.classList.add('flash');
        }
    </script>
</body>
</html>
